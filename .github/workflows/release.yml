name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Attach tarballs before publishing so immutable releases keep their assets.
      - name: Create package releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          pnpm -r list --depth -1 --json > "$RUNNER_TEMP/workspace-packages.json"
          while IFS= read -r package; do
            name=$(jq -r '.name' <<< "$package")
            version=$(jq -r '.version' <<< "$package")
            directory=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .path' "$RUNNER_TEMP/workspace-packages.json")
            tag="$name@$version"
            filename="${name#@}"
            archive="$RUNNER_TEMP/packages/${filename//\//-}-$version.tgz"
            notes="$RUNNER_TEMP/release-notes.md"
            pnpm --dir "$directory" pack --pack-destination "$RUNNER_TEMP/packages"
            awk '/^## / { section++; if (section == 2) exit } section == 1' "$directory/CHANGELOG.md" > "$notes"
            git push origin "refs/tags/$tag"
            gh release create "$tag" "$archive" --draft --verify-tag --title "$tag" --notes-file "$notes"
            gh release edit "$tag" --draft=false
          done < <(jq -c '.[]' <<< "$PUBLISHED_PACKAGES")
