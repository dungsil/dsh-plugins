name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: '배포할 패키지 이름 (비우면 전체 자동 릴리스)'
        type: string
        required: false
      version:
        description: '정확한 배포 버전 (package 지정 시에만 사용)'
        type: string
        required: false

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      packages: ${{ steps.release.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Require successful main CI check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check the source actually checked out, not the dispatch event's SHA.
          sha=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No main CI run found for $sha"
            exit 1
          fi
          if ! gh run view "$run_id" --json jobs | jq -e \
            'any(.jobs[]; .name == "check" and .status == "completed" and .conclusion == "success")' > /dev/null; then
            echo "::error::main CI check must succeed before releasing $sha (run $run_id)"
            exit 1
          fi
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # release-it attaches tarballs to drafts before publishing immutable releases.
      - run: pnpm release --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION"
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}

  market-index:
    needs: release
    if: needs.release.outputs.packages != '' && needs.release.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Index errors and timeouts must not turn a successful release into a failure.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update market index once for all published packages
        env:
          RELEASE_PACKAGES: ${{ needs.release.outputs.packages }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          const packages = JSON.parse(process.env.RELEASE_PACKAGES)
          execFileSync('pnpm', ['market:index', ...packages.flatMap(name => ['--release', name])], { stdio: 'inherit' })
          JS
      - name: Commit market index
        run: |
          if git diff --quiet -- market/index.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/index.json
          git commit -m 'chore(market): 릴리스한 패키지의 인덱스를 갱신한다 [skip ci]'
          git pull --no-rebase --no-edit origin main
          git push origin HEAD:main
