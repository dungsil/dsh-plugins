name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require immutable releases
        run: gh api "repos/$GH_REPO/immutable-releases" --jq '.enabled' | grep -qx true
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        id: release
        with:
          semantic_version: 25.0.9
      - name: Verify immutable release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.immutable' | grep -qx true
