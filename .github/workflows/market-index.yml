name: Market Index

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check market index is current
        run: pnpm market:index --check
