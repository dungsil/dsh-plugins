name: Market Index

on:
  push:
    paths:
      - '.github/workflows/market-index.yml'
      - 'scripts/market-index.mjs'
      - 'market/index.json'
      - 'packages/*/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.oxfmtrc.json'
      - '.editorconfig'
  pull_request:
    paths:
      - '.github/workflows/market-index.yml'
      - 'scripts/market-index.mjs'
      - 'market/index.json'
      - 'packages/*/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.oxfmtrc.json'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check market index is current
        run: pnpm market:index --check
