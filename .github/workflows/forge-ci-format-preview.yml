name: Temporary Forge CI formatting

on:
  pull_request:
    paths:
      - 'packages/forge-ci-notification/**'
      - '.github/workflows/forge-ci-format-preview.yml'

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --write packages/forge-ci-notification
      - name: Print formatted files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const changed = execFileSync('git', ['diff', '--name-only', '--', 'packages/forge-ci-notification'], { encoding: 'utf8' }).trim()
          for (const path of changed ? changed.split('\n') : []) {
            console.log('FORMAT_FILE_START ' + path)
            console.log(readFileSync(path).toString('base64'))
            console.log('FORMAT_FILE_END ' + path)
          }
          NODE
