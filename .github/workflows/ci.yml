name: CI

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'tools/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.editorconfig'
      - '.gitignore'
      # Skills are shipped plugin content, so do not exclude Markdown globally.
      - '!**/AGENTS.md'
      - '!packages/*/README.md'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/verification/**'
      - '!tools/*/README.md'
      - '!tools/*/CHANGELOG.md'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'tools/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.editorconfig'
      - '.gitignore'
      - '!**/AGENTS.md'
      - '!packages/*/README.md'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/verification/**'
      - '!tools/*/README.md'
      - '!tools/*/CHANGELOG.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Rehearse packaging all public packages
        run: |
          pnpm -r list --depth -1 --json | jq -r '.[] | select(.private != true) | .path' |
          while IFS= read -r directory; do
            pnpm --dir "$directory" pack --pack-destination "$RUNNER_TEMP/packages"
            # Rehearse publishing even when this version is already published.
            pnpm --dir "$directory" publish --dry-run --no-git-checks --force
          done
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: plugin-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
