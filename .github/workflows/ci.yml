name: CI

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'tools/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.editorconfig'
      - '.gitignore'
      # Skills are shipped plugin content, so do not exclude Markdown globally.
      - '!**/AGENTS.md'
      - '!packages/*/README.md'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/verification/**'
      - '!tools/*/README.md'
      - '!tools/*/CHANGELOG.md'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'tools/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.editorconfig'
      - '.gitignore'
      - '!**/AGENTS.md'
      - '!packages/*/README.md'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/verification/**'
      - '!tools/*/README.md'
      - '!tools/*/CHANGELOG.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container: node:26.13.0-bookworm-slim@sha256:cd820d60a7f3ae057389f3e1bcf1a0ac09dd57c428fe14f191dcbc5c56ac5fe2
    timeout-minutes: 15
    steps:
      - name: Install Git and cache tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates zstd
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          cache: pnpm
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm build
