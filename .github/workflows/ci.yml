name: CI

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'tools/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.editorconfig'
      - '.gitignore'
      # Skills are shipped plugin content, so do not exclude Markdown globally.
      - '!**/AGENTS.md'
      - '!packages/*/README.md'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/verification/**'
      - '!tools/*/README.md'
      - '!tools/*/CHANGELOG.md'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'tools/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.editorconfig'
      - '.gitignore'
      - '!**/AGENTS.md'
      - '!packages/*/README.md'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/verification/**'
      - '!tools/*/README.md'
      - '!tools/*/CHANGELOG.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm build
