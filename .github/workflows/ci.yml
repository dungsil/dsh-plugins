name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Rehearse packaging all public packages
        run: |
          pnpm -r list --depth -1 --json | jq -r '.[] | select(.private != true) | .path' |
          while IFS= read -r directory; do
            pnpm --dir "$directory" pack --pack-destination "$RUNNER_TEMP/packages"
            # Rehearse publishing even when this version is already published.
            pnpm --dir "$directory" publish --dry-run --no-git-checks --force
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
