name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @dungsil/dsh-plugin-locale-ko pack --pack-destination "$RUNNER_TEMP/packages"
      # Rehearse packaging even when the checked-in version is already published.
      - run: npm publish ./packages/locale-ko --dry-run --force
      - uses: actions/upload-artifact@v4
        with:
          name: locale-ko-package
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
