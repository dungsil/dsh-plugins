name: Temporary MCP formatting snapshot

on:
  pull_request:
    paths:
      - 'packages/ui-setting-mcp/**'
      - '.github/workflows/mcp-format-preview.yml'

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 26.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --write packages/ui-setting-mcp
      - name: Print exact formatted files for review
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const changed = execFileSync('git', ['diff', '--name-only', '--', 'packages/ui-setting-mcp'], { encoding: 'utf8' }).trim()
          for (const path of changed ? changed.split('\n') : []) {
            console.log('FORMAT_FILE_START ' + path)
            console.log(readFileSync(path).toString('base64'))
            console.log('FORMAT_FILE_END ' + path)
          }
          NODE
